<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VyNote — Share Your Life</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/index.css" rel="stylesheet" />
  <style>
    :root{--rn-red:#ff2442;--rn-red-dark:#e01f3a;--rn-red-soft:#fff0f2;--ink:#222;--sub:#8f8f8f;--line:#f0f0f2;--chip:#f5f5f7;--bg:#fff;--shadow:0 12px 40px rgba(0,0,0,.14);--card-bg:#fff;--header-bg:rgba(255,255,255,.92);--input-bg:#f5f5f7}
    [data-theme="dark"]{--ink:#e8e8ec;--sub:#9a9aa0;--line:#2a2a2e;--chip:#2a2a2e;--bg:#111113;--shadow:0 12px 40px rgba(0,0,0,.5);--card-bg:#1e1e22;--header-bg:rgba(17,17,19,.92);--input-bg:#2a2a2e;--rn-red-soft:#2a1520}
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;transition:background .3s,color .3s}
    ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#d9d9de;border-radius:8px}
    [data-theme="dark"] ::-webkit-scrollbar-thumb{background:#444}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
    @keyframes modalIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
    @keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
    @keyframes burstHeart{0%{transform:scale(0);opacity:0}30%{transform:scale(1.25);opacity:1}55%{transform:scale(1)}100%{transform:scale(1) translateY(-70px);opacity:0}}
    .anim-fadeIn{animation:fadeIn .5s ease both}
    .anim-pop{animation:pop .35s ease}
    .anim-modal{animation:modalIn .25s ease}
    .anim-toast{animation:toastIn .25s ease}
    .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    [data-theme="dark"] .header{background:var(--header-bg)}
    [data-theme="dark"] .modal{background:var(--card-bg)}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const API = 'http://localhost:5000';

const AUTHORS = {
  u1:{name:'Mia Chen',avatar:'https://i.pravatar.cc/150?img=1',verified:true,followers:'12.4k'},
  u2:{name:'Sofia Reed',avatar:'https://i.pravatar.cc/150?img=5',verified:true,followers:'48.1k'},
  u3:{name:'Leo Park',avatar:'https://i.pravatar.cc/150?img=11',verified:false,followers:'3,208'},
  u4:{name:'Zoe Lin',avatar:'https://i.pravatar.cc/150?img=9',verified:false,followers:'9,876'},
  u5:{name:'Nina Tanaka',avatar:'https://i.pravatar.cc/150?img=16',verified:true,followers:'21.7k'},
  me:{name:'You',avatar:'https://i.pravatar.cc/150?img=32',verified:false,followers:'356'}
};
const CATS = ['All','Fashion','Food','Travel','Beauty','Fitness','Home','Pets','Art','Photography'];
const TRENDING = ['autumn outfit ideas','matcha café near me','cozy desk setup','minimal skincare routine','kyoto travel guide'];
const HEART = (f) => <svg width="19" height="19" viewBox="0 0 24 24" fill={f?'currentColor':'none'} stroke="currentColor" strokeWidth="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7z"/></svg>;
const STAR = (f) => <svg width="19" height="19" viewBox="0 0 24 24" fill={f?'currentColor':'none'} stroke="currentColor" strokeWidth="2"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>;
const fmt = n => n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+'k':String(n);

function Toast({toasts}){return toasts.length?<div style={{position:'fixed',top:74,left:'50%',transform:'translateX(-50%)',zIndex:100,display:'flex',flexDirection:'column',gap:8,alignItems:'center',pointerEvents:'none'}}>{toasts.map(t=><div key={t.id} className="anim-toast" style={{background:'rgba(30,30,35,.9)',color:'#fff',fontSize:13,fontWeight:600,padding:'10px 20px',borderRadius:20,whiteSpace:'nowrap'}}>{t.msg}</div>)}</div>:null}

function NoteCard({note,onClick,onLike}){
  const a=AUTHORS[note.author]||{name:'Unknown',avatar:''};
  const [anim,setAnim]=useState(false);
  const [hov,setHov]=useState(false);
  return(
    <article className="anim-fadeIn" style={{breakInside:'avoid',marginBottom:20,cursor:'pointer'}} onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}>
      <div style={{position:'relative',borderRadius:10,overflow:'hidden',background:'#f3f3f5',aspectRatio:note.ratio||'4/5'}}>
        {note.video&&<div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(0,0,0,.3)',opacity:hov?1:0,transition:'opacity .3s'}}><div style={{width:48,height:48,borderRadius:'50%',background:'rgba(255,255,255,.9)',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 14px rgba(0,0,0,.3)'}}><svg width="20" height="20" viewBox="0 0 24 24" fill="#222"><path d="M8 5v14l11-7z"/></svg></div></div>}
        <img src={note.img} alt="" loading="lazy" style={{width:'100%',height:'100%',objectFit:'cover',transition:'transform .45s',transform:hov?'scale(1.05)':'scale(1)'}} />
        <span style={{position:'absolute',top:8,left:8,background:'rgba(0,0,0,.42)',backdropFilter:'blur(4px)',color:'#fff',fontSize:10.5,fontWeight:600,padding:'3px 9px',borderRadius:10,opacity:hov?1:0,transition:'opacity .3s'}}>{note.cat}</span>
      </div>
      <h3 className="line-clamp-2" style={{margin:'9px 2px 7px',fontSize:14,fontWeight:600,lineHeight:1.45,color:'var(--ink)'}}>{note.title}</h3>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 2px 4px'}}>
        <div style={{display:'flex',alignItems:'center',gap:6,minWidth:0}}><img src={a.avatar} alt="" style={{width:20,height:20,borderRadius:'50%',objectFit:'cover'}} /><span style={{fontSize:12,color:'#9a9a9f',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{a.name}</span></div>
        <button onClick={e=>{e.stopPropagation();setAnim(true);setTimeout(()=>setAnim(false),350);onLike();}} style={{display:'flex',alignItems:'center',gap:4,color:note.liked?'var(--rn-red)':'#9a9a9f',padding:4,borderRadius:8,cursor:'pointer',border:'none',background:'none'}}>
          {HEART(note.liked)}<span style={{fontSize:12,fontWeight:500}}>{fmt(note.likes)}</span>
        </button>
      </div>
    </article>
  );
}

function NoteModal({note,follows,onClose,onLike,onCollect,onComment,onFollow,addToast}){
  const [comment,setComment]=useState('');
  const [ln,setLn]=useState(note);
  const [heartBurst,setHeartBurst]=useState(null);
  const a=AUTHORS[note.author]||{name:'Unknown',avatar:'',verified:false,followers:'0'};
  const VBADGE=<svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ff2442"/><path d="m8.5 12.2 2.4 2.4 4.6-5" stroke="#fff" strokeWidth="2.2" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>;
  const handleDoubleTap=(e)=>{const r=e.currentTarget.getBoundingClientRect();if(!ln.liked){onLike();setLn(p=>({...p,liked:true,likes:p.likes+1}))}setHeartBurst({x:e.clientX-r.left-45,y:e.clientY-r.top-45});setTimeout(()=>setHeartBurst(null),800)};
  const handleComment=async()=>{if(!comment.trim())return;const c=await onComment(note.id,comment);if(c){setLn(p=>({...p,comments:[...p.comments,c]}));setComment('')}};
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(20,20,25,.62)',backdropFilter:'blur(3px)',zIndex:80,display:'flex',alignItems:'center',justifyContent:'center',padding:20}} onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="anim-modal" style={{width:'min(1080px,96vw)',height:'min(700px,92vh)',background:'var(--card-bg)',borderRadius:18,overflow:'hidden',display:'flex',position:'relative'}}>
        <div style={{flex:1.35,background:'#000',position:'relative',display:'flex',alignItems:'center',justifyContent:'center',userSelect:'none',overflow:'hidden'}} onDoubleClick={handleDoubleTap}>
          {note.video?<video src={note.video} controls autoPlay style={{width:'100%',height:'100%',objectFit:'contain'}}/>:<img src={note.img} alt="" style={{width:'100%',height:'100%',objectFit:'contain'}}/>}
          {heartBurst&&<svg style={{position:'absolute',width:90,height:90,fill:'var(--rn-red)',filter:'drop-shadow(0 4px 14px rgba(255,36,66,.6))',left:heartBurst.x,top:heartBurst.y,zIndex:4,pointerEvents:'none'}} viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7z"/></svg>}
          <button onClick={onClose} style={{position:'absolute',top:14,right:14,width:36,height:36,borderRadius:'50%',background:'rgba(0,0,0,.45)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',zIndex:5,border:'none',cursor:'pointer'}}><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <div style={{width:400,flexShrink:0,display:'flex',flexDirection:'column',background:'var(--card-bg)'}}>
          <div style={{display:'flex',alignItems:'center',gap:10,padding:16,borderBottom:'1px solid var(--line)'}}>
            <img src={a.avatar} alt="" style={{width:40,height:40,borderRadius:'50%',objectFit:'cover'}}/>
            <div style={{flex:1,minWidth:0}}><b style={{fontSize:14.5,display:'flex',alignItems:'center',gap:5}}>{a.name} {a.verified&&VBADGE}</b><span style={{fontSize:11.5,color:'var(--sub)'}}>{a.followers} followers</span></div>
            {note.author!=='me'&&<button onClick={()=>onFollow(note.author)} style={{height:30,padding:'0 16px',borderRadius:15,background:follows[note.author]?'var(--chip)':'var(--rn-red)',color:follows[note.author]?'#888':'#fff',fontSize:12.5,fontWeight:700,border:'none',cursor:'pointer'}}>{follows[note.author]?'Following':'Follow'}</button>}
          </div>
          <div style={{flex:1,overflowY:'auto',padding:16}}>
            <h2 style={{fontSize:17,fontWeight:700,lineHeight:1.4,marginBottom:10}}>{ln.title}</h2>
            <p style={{fontSize:14,lineHeight:1.65,color:'var(--ink)',whiteSpace:'pre-line'}}>{ln.desc}</p>
            <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:12}}>{ln.tags.map(t=><span key={t} style={{color:'#3a6dbf',fontSize:13,cursor:'pointer'}}>{t}</span>)}</div>
            <div style={{fontSize:11.5,color:'#b3b3b8',marginTop:14,paddingBottom:14,borderBottom:'1px solid var(--line)'}}>{ln.time}</div>
            <h4 style={{fontSize:13.5,fontWeight:700,margin:'14px 0 4px'}}>Comments ({ln.comments.length})</h4>
            {ln.comments.length?ln.comments.map((c,i)=>{const ca=AUTHORS[c.who]||{name:'Unknown',avatar:''};return(<div key={i} style={{display:'flex',gap:10,padding:'12px 0'}}><img src={ca.avatar} alt="" style={{width:32,height:32,borderRadius:'50%',objectFit:'cover',flexShrink:0}}/><div style={{flex:1,minWidth:0}}><b style={{fontSize:12,color:'#9a9a9f',fontWeight:600,display:'block'}}>{c.who==='me'?'You':ca.name}</b><p style={{fontSize:13.5,lineHeight:1.5,marginTop:3,color:'var(--ink)'}}>{c.text}</p><div style={{display:'flex',gap:14,marginTop:5,fontSize:11,color:'#b3b3b8'}}><span>{c.time}</span></div></div></div>)}):<p style={{color:'#b5b5ba',fontSize:13,padding:'14px 0'}}>No comments yet — be the first! 🙋</p>}
          </div>
          <div style={{borderTop:'1px solid var(--line)',padding:'10px 14px',display:'flex',alignItems:'center',gap:4}}>
            <button onClick={()=>{onLike();setLn(p=>({...p,liked:!p.liked,likes:p.liked?p.likes-1:p.likes+1}))}} style={{display:'flex',alignItems:'center',gap:6,padding:'8px 10px',borderRadius:12,color:ln.liked?'var(--rn-red)':'#444',fontSize:13,fontWeight:600,border:'none',background:'none',cursor:'pointer'}}>{HEART(ln.liked)}<span>{fmt(ln.likes)}</span></button>
            <button onClick={()=>{onCollect();setLn(p=>({...p,collected:!p.collected,collects:p.collected?p.collects-1:p.collects+1}))}} style={{display:'flex',alignItems:'center',gap:6,padding:'8px 10px',borderRadius:12,color:ln.collected?'var(--rn-red)':'#444',fontSize:13,fontWeight:600,border:'none',background:'none',cursor:'pointer'}}>{STAR(ln.collected)}<span>{fmt(ln.collects)}</span></button>
          </div>
          <div style={{display:'flex',gap:8,padding:'0 14px 14px'}}>
            <input value={comment} onChange={e=>setComment(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleComment()} placeholder="Say something nice…" style={{flex:1,height:38,borderRadius:19,background:'var(--input-bg)',padding:'0 15px',border:'none',outline:'none',fontSize:14,color:'var(--ink)'}}/>
            <button onClick={handleComment} style={{width:38,height:38,borderRadius:'50%',background:'var(--rn-red)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,border:'none',cursor:'pointer'}}><svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="M2 21 23 12 2 3v7l15 2-15 2z"/></svg></button>
          </div>
        </div>
      </div>
    </div>
  );
}

function CreateModal({onClose,onCreate,addToast}){
  const [title,setTitle]=useState(''),[desc,setDesc]=useState(''),[cat,setCat]=useState('Food'),[tags,setTags]=useState([]),[tagInput,setTagInput]=useState(''),[cover,setCover]=useState(null);
  const handlePublish=async()=>{if(!title.trim()){addToast('Title required ✏️');return}await onCreate({title:title.trim(),desc:desc.trim(),cat,tags,img:cover||`https://picsum.photos/seed/${Date.now()}/600/750`,ratio:'4/5'});onClose()};
  const handleTag=e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();let v=tagInput.trim().replace(/,+$/,'');if(!v)return;if(!v.startsWith('#'))v='#'+v;if(tags.length>=5){addToast('Max 5 tags');return}if(!tags.includes(v))setTags([...tags,v]);setTagInput('')}};
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(20,20,25,.62)',backdropFilter:'blur(3px)',zIndex:80,display:'flex',alignItems:'center',justifyContent:'center',padding:20}} onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="anim-modal" style={{width:'min(680px,96vw)',maxHeight:'92vh',overflowY:'auto',background:'var(--card-bg)',borderRadius:18,padding:24,position:'relative'}}>
        <button onClick={onClose} style={{position:'absolute',top:16,right:16,width:34,height:34,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',color:'#666',border:'none',background:'none',cursor:'pointer'}}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <h3 style={{fontSize:18,fontWeight:800,marginBottom:4}}>Create a note ✍️</h3>
        <p style={{color:'var(--sub)',fontSize:13,marginBottom:18}}>Share your moment with the community</p>
        <div style={{display:'flex',gap:20}}>
          <div style={{width:220,flexShrink:0}}>
            <label style={{width:'100%',aspectRatio:'3/4',border:'2px dashed #dcdce2',borderRadius:14,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:8,color:'#a0a0a6',cursor:'pointer',overflow:'hidden',position:'relative',background:'#fafafc'}}>
              {cover?<img src={cover} alt="" style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover'}}/>:<><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" width="30" height="30"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span style={{fontSize:12.5,fontWeight:600}}>Add cover</span></>}
              <input type="file" accept="image/*" hidden onChange={e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>setCover(r.result);r.readAsDataURL(f)}}/>
            </label>
          </div>
          <div style={{flex:1,minWidth:0}}>
            <label style={{fontSize:12,fontWeight:700,color:'#666',margin:'12px 0 6px',display:'block'}}>TITLE *</label>
            <input value={title} onChange={e=>setTitle(e.target.value)} maxLength={60} placeholder="An eye-catching title…" style={{width:'100%',borderRadius:10,background:'var(--input-bg)',padding:'11px 13px',color:'var(--ink)',border:'none',outline:'none',fontSize:14}}/>
            <label style={{fontSize:12,fontWeight:700,color:'#666',margin:'12px 0 6px',display:'block'}}>DESCRIPTION</label>
            <textarea value={desc} onChange={e=>setDesc(e.target.value)} maxLength={500} rows={4} placeholder="Tell everyone about it…" style={{width:'100%',borderRadius:10,background:'var(--input-bg)',padding:'11px 13px',color:'var(--ink)',resize:'vertical',border:'none',outline:'none',fontSize:14,lineHeight:1.55}}/>
            <label style={{fontSize:12,fontWeight:700,color:'#666',margin:'12px 0 6px',display:'block'}}>TAGS <span style={{fontWeight:500,color:'#aaa'}}>(Enter to add)</span></label>
            <input value={tagInput} onChange={e=>setTagInput(e.target.value)} onKeyDown={handleTag} placeholder="#cafehopping" style={{width:'100%',borderRadius:10,background:'var(--input-bg)',padding:'11px 13px',color:'var(--ink)',border:'none',outline:'none',fontSize:14}}/>
            <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:8}}>{tags.map((t,i)=><span key={t} style={{background:'var(--rn-red-soft)',color:'var(--rn-red)',fontSize:12,fontWeight:600,padding:'5px 10px',borderRadius:12,display:'flex',alignItems:'center',gap:6}}>{t}<button onClick={()=>setTags(tags.filter((_,j)=>j!==i))} style={{color:'var(--rn-red)',fontWeight:800,fontSize:12,border:'none',background:'none',cursor:'pointer'}}>✕</button></span>)}</div>
            <label style={{fontSize:12,fontWeight:700,color:'#666',margin:'12px 0 6px',display:'block'}}>CATEGORY</label>
            <select value={cat} onChange={e=>setCat(e.target.value)} style={{width:'100%',borderRadius:10,background:'var(--input-bg)',padding:'11px 13px',color:'var(--ink)',border:'none',outline:'none',fontSize:14}}>
              {CATS.filter(c=>c!=='All').map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
        </div>
        <button onClick={handlePublish} style={{width:'100%',marginTop:20,height:46,borderRadius:23,background:'var(--rn-red)',color:'#fff',fontSize:15,fontWeight:800,boxShadow:'0 6px 18px rgba(255,36,66,.35)',border:'none',cursor:'pointer'}}>Publish note</button>
      </div>
    </div>
  );
}

function App(){
  const [notes,setNotes]=useState([]),[cat,setCat]=useState('All'),[search,setSearch]=useState(''),[selected,setSelected]=useState(null),[showCreate,setShowCreate]=useState(false),[dark,setDark]=useState(false),[toasts,setToasts]=useState([]),[follows,setFollows]=useState({});
  const addToast=useCallback(msg=>{const id=Date.now();setToasts(t=>[...t,{id,msg}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),2500)},[]);

  useEffect(()=>{const s=localStorage.getItem('rn-theme');if(s==='dark'){setDark(true);document.documentElement.setAttribute('data-theme','dark')}fetchNotes()},[]);
  useEffect(()=>{if(dark){document.documentElement.setAttribute('data-theme','dark');localStorage.setItem('rn-theme','dark')}else{document.documentElement.removeAttribute('data-theme');localStorage.setItem('rn-theme','light')}},[dark]);

  const fetchNotes=async(c,q)=>{try{const p=new URLSearchParams();if(c&&c!=='All')p.set('category',c);if(q)p.set('search',q);const r=await fetch(`${API}/api/notes?${p}`);const d=await r.json();setNotes(d.notes)}catch(e){console.error(e)}};
  const handleCat=c=>{setCat(c);fetchNotes(c,search)};
  const handleSearch=q=>{setSearch(q);fetchNotes(cat,q)};
  const toggleLike=async n=>{try{const nl=!n.liked;await fetch(`${API}/api/notes/${n.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({liked:nl})});setNotes(p=>p.map(x=>x.id===n.id?{...x,liked:nl,likes:x.likes+(nl?1:-1)}:x));if(selected?.id===n.id)setSelected(p=>p?{...p,liked:nl,likes:p.likes+(nl?1:-1)}:null)}catch{}};
  const toggleCollect=async n=>{try{const nc=!n.collected;await fetch(`${API}/api/notes/${n.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({collected:nc})});setNotes(p=>p.map(x=>x.id===n.id?{...x,collected:nc,collects:x.collects+(nc?1:-1)}:x));if(selected?.id===n.id)setSelected(p=>p?{...p,collected:nc,collects:p.collects+(nc?1:-1)}:null)}catch{}};
  const addComment=async(nid,text)=>{try{const r=await fetch(`${API}/api/notes/${nid}/comments`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});const c=await r.json();setNotes(p=>p.map(x=>x.id===nid?{...x,comments:[...x.comments,c]}:x));if(selected?.id===nid)setSelected(p=>p?{...p,comments:[...p.comments,c]}:null);return c}catch{}};
  const createNote=async d=>{try{const r=await fetch(`${API}/api/notes`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const n=await r.json();setNotes(p=>[n,...p]);addToast('Note published 🎉')}catch{}};
  const toggleFollow=async uid=>{try{await fetch(`${API}/api/users/${uid}/follow`,{method:'POST'});setFollows(p=>({...p,[uid]:!p[uid]}))}catch{}};

  return(
    <div style={{minHeight:'100vh',background:'var(--bg)',color:'var(--ink)'}}>
      <header className="header" style={{position:'fixed',top:0,left:0,right:0,height:60,background:'var(--header-bg)',backdropFilter:'blur(12px)',borderBottom:'1px solid var(--line)',display:'flex',alignItems:'center',gap:16,padding:'0 24px',zIndex:50}}>
        <div style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',flexShrink:0}} onClick={()=>{setSearch('');fetchNotes(cat,'')}}>
          <div style={{width:32,height:32,borderRadius:9,background:'var(--rn-red)',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 12px rgba(255,36,66,.35)'}}><svg viewBox="0 0 24 24" width="17" height="17" fill="#fff"><path d="M12 21c-4.8-3.3-9-6.6-9-10.6C3 7.4 5.2 5.3 7.9 5.3c1.6 0 3.1.8 4.1 2.2 1-1.4 2.5-2.2 4.1-2.2 2.7 0 4.9 2.1 4.9 5.1 0 4-4.2 7.3-9 10.6z"/></svg></div>
          <span style={{fontWeight:800,fontSize:19,letterSpacing:'-.4px',color:'var(--rn-red)'}}>vynote</span>
        </div>
        <div style={{flex:1,maxWidth:520,margin:'0 auto',position:'relative'}}>
          <input value={search} onChange={e=>handleSearch(e.target.value)} placeholder="Search notes, people, topics…" style={{width:'100%',height:38,borderRadius:19,background:'var(--input-bg)',padding:'0 16px 0 40px',color:'var(--ink)',border:'none',outline:'none',fontSize:14}}/>
          <svg style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',width:16,height:16,color:'#9a9aa0'}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0,marginLeft:'auto'}}>
          <button onClick={()=>setDark(!dark)} title="Toggle Theme" style={{width:40,height:40,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',color:'#444',border:'none',background:'none',cursor:'pointer'}}>{dark?'☀️':'🌙'}</button>
          <button onClick={()=>setShowCreate(true)} style={{display:'flex',alignItems:'center',gap:6,height:38,padding:'0 18px',borderRadius:19,background:'var(--rn-red)',color:'#fff',fontWeight:700,fontSize:13.5,boxShadow:'0 4px 14px rgba(255,36,66,.35)',border:'none',cursor:'pointer',margin:'0 6px'}}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M12 5v14M5 12h14"/></svg><span>Create</span></button>
          <img src="https://i.pravatar.cc/150?img=32" alt="" style={{width:34,height:34,borderRadius:'50%',objectFit:'cover',cursor:'pointer',border:'2px solid #fff',boxShadow:'0 0 0 1.5px var(--rn-red)'}}/>
        </div>
      </header>

      <nav style={{position:'fixed',top:60,left:0,right:0,zIndex:40,background:'var(--header-bg)',backdropFilter:'blur(10px)',display:'flex',gap:8,padding:'10px 24px',overflowX:'auto',borderBottom:'1px solid var(--line)'}}>
        {CATS.map(c=><button key={c} onClick={()=>handleCat(c)} style={{flexShrink:0,height:32,padding:'0 16px',borderRadius:16,background:c===cat?'var(--rn-red)':'var(--chip)',color:c===cat?'#fff':'#555',fontSize:13,fontWeight:600,border:'none',cursor:'pointer',transition:'all .18s',boxShadow:c===cat?'0 3px 10px rgba(255,36,66,.3)':'none'}}>{c==='All'?'✦ '+c:c}</button>)}
      </nav>

      <main style={{padding:'122px 24px 90px',maxWidth:1600,margin:'0 auto'}}>
        <div style={{columnCount:5,columnGap:20}}>
          {notes.length?notes.map((n,i)=><NoteCard key={n.id} note={n} onClick={()=>setSelected(n)} onLike={()=>toggleLike(n)}/>):<div style={{textAlign:'center',color:'#b5b5ba',padding:'60px 0',fontSize:13,columnSpan:'all'}}>🔍 No notes found — try another keyword!</div>}
        </div>
      </main>

      {selected&&<NoteModal note={selected} follows={follows} onClose={()=>setSelected(null)} onLike={()=>toggleLike(selected)} onCollect={()=>toggleCollect(selected)} onComment={addComment} onFollow={toggleFollow} addToast={addToast}/>}
      {showCreate&&<CreateModal onClose={()=>setShowCreate(false)} onCreate={createNote} addToast={addToast}/>}
      <Toast toasts={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
